name: cache-lab-experiment

services:
  redis:
    image: redis:8.6.3
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    cpus: 1.0
    mem_limit: 512m

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  
  origin:
    build: 
      context: ./origin
      dockerfile: Dockerfile

    environment:
      ORIGIN_DELAY_MS: "50"
    
    ports:
      - "127.0.0.1:8001:8001"
    
    cpus: 1.0
    mem_limit: 512m

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    
    environment:
      REDIS_URL: redis://redis:6379/0
      ORIGIN_URL: http://origin:8001
      PREFETCH_ENABLED: ${PREFETCH_ENABLED:-false}
      EXPERIMENT_CONTROL_ENABLED: ${EXPERIMENT_CONTROL_ENABLED:-false}
      PREFETCH_TRAIN_TRACE: data/traces/web_workload.csv

    ports:
      - "127.0.0.1:8000:8000"

    
    depends_on:
      redis:
        condition: service_healthy
      origin:
        condition: service_healthy
    
    cpus: 2.0
    mem_limit: 1g
  
  locust:
    image: cache-lab-experiment-backend

    profiles:
      - load
    
    working_dir: /app

    entrypoint:
      - python
      - -m
      - locust
    
    environment:
      CACHELAB_BACKEND_URL: http://backend:8000
      NO_PROXY: backend,origin,redis,localhost,127.0.0.1
      no_proxy: backend,origin,redis,localhost,127.0.0.1
    
    volumes:
      - ./server/load:/app/load:ro
      - ./server/data:/app/data:ro
      - ./server/results:/app/results
    
    cpus: 2.0
    mem_limit: 1g